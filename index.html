<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>盤點快手 (Inventory Master)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- 引入 html5-qrcode 條碼掃描套件 -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .fade-in { animation: fadeIn 0.25s ease-out forwards; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }
        /* 修飾掃描器影片外觀 */
        #reader video { border-radius: 1rem; object-fit: cover; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen">
    <div id="app-container" class="w-full max-w-[430px] h-[100dvh] max-h-[900px] bg-white sm:rounded-[2.5rem] sm:border-[8px] border-gray-800 sm:shadow-2xl relative overflow-hidden flex flex-col">
        <div id="root" class="w-full h-full flex flex-col relative bg-gray-50"></div>
        
        <!-- Toast 通知提升 z-index 確保在所有彈窗之上 -->
        <div id="toast" class="absolute top-10 left-1/2 transform -translate-x-1/2 bg-gray-800 text-white px-4 py-2 rounded-full shadow-lg text-sm font-bold opacity-0 pointer-events-none transition-opacity duration-300 z-[70] flex items-center gap-2 w-max max-w-[90%]">
            <i class="fas fa-info-circle"></i> <span id="toast-msg"></span>
        </div>

        <!-- 條碼掃描全螢幕覆蓋層 -->
        <div id="scanner-overlay" class="absolute inset-0 bg-black z-[60] hidden flex-col">
            <div class="flex justify-between items-center p-4 bg-gray-900 text-white flex-shrink-0 shadow-md z-10">
                <h3 class="font-bold text-lg"><i class="fas fa-barcode mr-2"></i>掃描條碼</h3>
                <button onclick="window.stopBarcodeScan()" class="text-white bg-gray-700 hover:bg-gray-600 active:bg-gray-500 px-4 py-2 rounded-xl text-sm font-bold transition-colors">取消</button>
            </div>
            <div class="flex-1 w-full bg-black relative flex flex-col items-center justify-center p-4">
                <div id="reader" class="w-full max-w-[400px] rounded-2xl overflow-hidden shadow-2xl bg-gray-900 border border-gray-700"></div>
                <p class="text-gray-400 text-xs mt-6 text-center font-bold">請將條碼對準掃描框內<br>系統將自動進行辨識</p>
            </div>
        </div>

        <div id="modal-overlay" class="absolute inset-0 bg-black/50 z-40 hidden opacity-0 transition-opacity flex items-center justify-center p-4">
            <div id="modal-content" class="bg-white rounded-2xl p-5 w-full shadow-xl transform scale-95 transition-transform max-h-[90vh] overflow-y-auto no-scrollbar"></div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, deleteDoc, onSnapshot, collection } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // ==========================================
        // 🛡️ 系統安全設定 (帳號白名單)
        // ==========================================
        window.systemConfig = {
            enableWhitelist: true, 
            allowedEmails: [
                'leo101k1@gmail.com',
                'kkb.aaa1@gmail.com'
            ]
        };

        // ==========================================
        // 🔥 Firebase 金鑰設定
        // ==========================================
        const currentAppId = 'inventory-master-9d841'; 
        
        const fbConfig = {
            apiKey: "AIzaSyCh_vi9fk6JpeHa1o344Zb763WSW-OlMt4",
            authDomain: "inventory-master-9d841.firebaseapp.com",
            projectId: "inventory-master-9d841",
            storageBucket: "inventory-master-9d841.firebasestorage.app",
            messagingSenderId: "503806430013",
            appId: "1:503806430013:web:c477e9b3cbcec2fe615354",
            measurementId: "G-WZP671BP7T"
        };

        window.state = {
            isLoading: true, 
            currentUser: null, 
            uid: null,
            allProjects: [], 
            allUsersMap: {}, 
            currentView: 'login',
            dashboardTab: 'active', 
            selectedRecordId: null,
            selectedItemId: null,
            returnView: null,
            tempPhotosData: [], 
            tempInventoryPhotos: [], 
            activeSession: null,
            options: { statuses: ['正常', '堪用', '破損', '待修', '建議報廢'] },
            projects: []
        };

        let db, auth;

        try {
            const app = initializeApp(fbConfig);
            auth = getAuth(app);
            db = getFirestore(app);

            let isSyncSetup = false;

            const setupRealtimeSync = (user) => {
                if (isSyncSetup) return;
                isSyncSetup = true;
                
                window.state.uid = user.uid;

                try {
                    const usersRef = collection(db, 'artifacts', currentAppId, 'public', 'data', 'users');
                    onSnapshot(usersRef, (snapshot) => {
                        const usersMap = {};
                        snapshot.forEach(doc => usersMap[doc.id] = doc.data());
                        window.state.allUsersMap = usersMap;
                        
                        if (usersMap[user.uid]) {
                            window.state.currentUser = usersMap[user.uid];
                            if (window.state.currentView === 'login') {
                                window.state.currentView = 'dashboard';
                            }
                        } else {
                            window.state.currentUser = { uid: user.uid, name: user.displayName || '使用者' };
                            if (window.state.currentView === 'login') window.state.currentView = 'dashboard';
                        }
                        if (!window.state.isLoading) window.render();
                    }, (err) => {
                        console.warn("Users Snapshot error (可能為權限不足):", err);
                        window.state.currentUser = { uid: user.uid, name: user.displayName || '系統用戶' };
                        if (window.state.currentView === 'login') window.state.currentView = 'dashboard';
                        if (!window.state.isLoading) window.render();
                    });

                    const projectsRef = collection(db, 'artifacts', currentAppId, 'public', 'data', 'projects');
                    onSnapshot(projectsRef, (snapshot) => {
                        const allCloudProjects = [];
                        snapshot.forEach(doc => {
                            let p = doc.data();
                            if(!p.ownerId) p.ownerId = 'system';
                            if(!p.members) p.members = [];
                            if(!p.inviteCode) p.inviteCode = Math.random().toString(36).substring(2, 8).toUpperCase();
                            allCloudProjects.push(p);
                        });
                        
                        window.state.allProjects = allCloudProjects;

                        if (window.state.uid) {
                            const myUid = window.state.uid;
                            window.state.projects = allCloudProjects.filter(p => 
                                p.ownerId === myUid || p.members.includes(myUid)
                            ).sort((a,b) => b.id.localeCompare(a.id));
                        }
                        
                        window.state.isLoading = false;
                        window.render();
                    }, (err) => {
                        console.error("Projects Snapshot error:", err);
                        window.showToast('⚠️ 資料庫權限不足，請至 Firebase 設定安全規則', 'error');
                        window.state.isLoading = false;
                        window.render();
                    });
                } catch(syncErr) {
                    console.error("Sync init error:", syncErr);
                    window.state.isLoading = false;
                    window.render();
                }
            };

            onAuthStateChanged(auth, (user) => {
                if (user) {
                    setupRealtimeSync(user);
                } else {
                    isSyncSetup = false;
                    window.state.currentUser = null;
                    window.state.uid = null;
                    window.state.isLoading = false;
                    window.state.currentView = 'login';
                    window.render();
                }
            });

        } catch(e) {
            console.error("Firebase init failed", e);
            window.state.isLoading = false;
            window.state.currentView = 'login';
            setTimeout(() => {
                window.render();
                window.showToast('系統連線異常，請稍後重新載入網頁', 'error');
            }, 100);
        }

        window.syncProjectToCloud = async (project) => {
            if (!auth || !auth.currentUser || !db) return;
            try {
                const docRef = doc(db, 'artifacts', currentAppId, 'public', 'data', 'projects', project.id);
                await setDoc(docRef, project); 
            } catch(e) {
                console.error("Sync error:", e);
                window.showToast('雲端同步發生異常', 'error');
            }
        };

        window.deleteProjectFromCloud = async (projectId) => {
            if (!auth || !auth.currentUser || !db) return;
            try {
                const docRef = doc(db, 'artifacts', currentAppId, 'public', 'data', 'projects', projectId);
                await deleteDoc(docRef);
            } catch(e) {
                console.error("Delete error:", e);
                window.showToast('雲端刪除失敗', 'error');
            }
        };

        window.compressImage = (file, callback) => {
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 800; const MAX_HEIGHT = 800;
                    let width = img.width; let height = img.height;
                    if (width > height) { if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; } } 
                    else { if (height > MAX_HEIGHT) { width *= MAX_HEIGHT / height; height = MAX_HEIGHT; } }
                    canvas.width = width; canvas.height = height;
                    const ctx = canvas.getContext('2d'); ctx.drawImage(img, 0, 0, width, height);
                    callback(canvas.toDataURL('image/jpeg', 0.6)); 
                }
                img.src = e.target.result;
            }
            reader.readAsDataURL(file);
        };

        let toastTimeout;
        window.showToast = (message, type = 'info') => {
            const toastEl = document.getElementById('toast');
            document.getElementById('toast-msg').innerText = message;
            toastEl.className = `absolute top-10 left-1/2 transform -translate-x-1/2 px-5 py-3 rounded-full shadow-lg text-sm font-bold transition-opacity duration-300 z-[70] flex items-center gap-2 w-max max-w-[90%] ${type === 'error' ? 'bg-red-500 text-white' : 'bg-gray-800 text-white'}`;
            toastEl.style.opacity = '1';
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => { toastEl.style.opacity = '0'; }, 3000);
        };

        window.openModal = (htmlContent) => {
            const overlay = document.getElementById('modal-overlay');
            const content = document.getElementById('modal-content');
            content.innerHTML = htmlContent;
            overlay.classList.remove('hidden');
            setTimeout(() => { overlay.classList.remove('opacity-0'); content.classList.remove('scale-95'); }, 10);
        };

        window.closeModal = () => {
            const overlay = document.getElementById('modal-overlay');
            const content = document.getElementById('modal-content');
            overlay.classList.add('opacity-0'); content.classList.add('scale-95');
            setTimeout(() => { overlay.classList.add('hidden'); }, 300);
        };

        window.getStatusColorClass = (status) => {
            switch(status) {
                case '正常': return 'bg-green-100 text-green-700';
                case '堪用': return 'bg-blue-100 text-blue-700';
                case '破損': return 'bg-red-100 text-red-700';
                case '待修': return 'bg-orange-100 text-orange-700';
                case '建議報廢': return 'bg-gray-200 text-gray-700';
                default: return 'bg-gray-100 text-gray-500';
            }
        };

        // ==========================================
        // 📷 條碼掃描核心功能 (使用 html5-qrcode)
        // ==========================================
        let html5QrCode = null;

        window.startBarcodeScan = () => {
            const scannerOverlay = document.getElementById('scanner-overlay');
            scannerOverlay.classList.remove('hidden');
            scannerOverlay.classList.add('flex');
            
            if (!html5QrCode) {
                html5QrCode = new Html5Qrcode("reader");
            }

            const qrCodeSuccessCallback = (decodedText, decodedResult) => {
                // 掃描成功，傳入結果並關閉掃描器
                window.stopBarcodeScan(decodedText);
            };

            // 設定掃描框大小與偵測頻率
            const config = { fps: 10, qrbox: { width: 250, height: 150 }, aspectRatio: 1.0 };
            
            html5QrCode.start({ facingMode: "environment" }, config, qrCodeSuccessCallback)
            .catch(err => {
                console.error("Camera start error:", err);
                window.showToast("無法開啟相機，請確認瀏覽器已允許相機權限", "error");
                window.stopBarcodeScan(); // 出錯時自動關閉介面
            });
        };

        window.stopBarcodeScan = (decodedText = null) => {
            const hideScannerUI = () => {
                const scannerOverlay = document.getElementById('scanner-overlay');
                scannerOverlay.classList.add('hidden');
                scannerOverlay.classList.remove('flex');
                
                // 如果有掃描到文字，填入搜尋框並觸發搜尋
                if (decodedText && typeof decodedText === 'string') {
                    window.showToast(`✅ 辨識成功: ${decodedText}`);
                    const input = document.getElementById('inventory-search-input');
                    if(input) {
                        input.value = decodedText;
                        window.filterActiveInventory(decodedText);
                    }
                }
            };

            if (html5QrCode && html5QrCode.isScanning) {
                html5QrCode.stop().then(() => {
                    hideScannerUI();
                }).catch((err) => {
                    console.warn("Error stopping scanner", err);
                    hideScannerUI();
                });
            } else {
                hideScannerUI();
            }
        };

        // ==========================================
        // 報表匯出功能
        // ==========================================
        window.showExportModal = () => {
            const today = new Date().toISOString().split('T')[0]; 
            window.openModal(`
                <h3 class="text-lg font-bold text-gray-800 mb-4"><i class="fas fa-file-excel text-emerald-500 mr-2"></i>匯出報表</h3>
                <div class="mb-4 space-y-3">
                    <label class="flex items-center gap-3 p-3 border border-gray-200 rounded-xl cursor-pointer hover:bg-gray-50 transition-colors">
                        <input type="radio" name="export-type" value="all" checked onchange="document.getElementById('date-range-picker').classList.add('hidden')" class="w-4 h-4 text-emerald-600 focus:ring-emerald-500">
                        <div><div class="text-sm font-bold text-gray-800">最新庫存總表</div><div class="text-[10px] text-gray-500">匯出目前系統中所有物品的最新數量與位置</div></div>
                    </label>
                    <label class="flex items-center gap-3 p-3 border border-gray-200 rounded-xl cursor-pointer hover:bg-gray-50 transition-colors">
                        <input type="radio" name="export-type" value="changes" onchange="document.getElementById('date-range-picker').classList.remove('hidden')" class="w-4 h-4 text-emerald-600 focus:ring-emerald-500">
                        <div><div class="text-sm font-bold text-gray-800">指定期間異動明細</div><div class="text-[10px] text-gray-500">包含期間內「新增的物品」以及「盤點發生增減」的紀錄</div></div>
                    </label>
                </div>
                <div id="date-range-picker" class="hidden mb-6 bg-gray-50 p-4 rounded-xl border border-gray-200">
                    <label class="block text-xs font-bold text-gray-500 mb-2 uppercase">選擇篩選區間</label>
                    <div class="flex gap-2 items-center text-sm">
                        <input type="date" id="export-start" value="${today}" class="flex-1 bg-white border border-gray-300 rounded-lg p-2 text-gray-700 outline-none focus:ring-2 focus:ring-emerald-500">
                        <span class="text-gray-400 font-bold">至</span>
                        <input type="date" id="export-end" value="${today}" class="flex-1 bg-white border border-gray-300 rounded-lg p-2 text-gray-700 outline-none focus:ring-2 focus:ring-emerald-500">
                    </div>
                </div>
                <div class="flex gap-3 mt-2">
                    <button onclick="window.closeModal()" class="flex-1 py-3 bg-gray-100 text-gray-600 font-bold rounded-xl active:bg-gray-200">取消</button>
                    <button onclick="window.executeExport()" class="flex-1 py-3 bg-emerald-600 text-white font-bold rounded-xl active:bg-emerald-700 shadow-md flex items-center justify-center gap-2"><i class="fas fa-download"></i> 確認匯出</button>
                </div>
            `);
        };

        window.executeExport = () => {
            const project = window.state.projects.find(p => p.id === window.state.selectedProjectId);
            if (!project) return window.showToast('找不到專案資料', 'error');
            if (project.masterItems.length === 0) return window.showToast('尚無物品資料可匯出', 'error');

            const exportType = document.querySelector('input[name="export-type"]:checked').value;
            let csvContent = "data:text/csv;charset=utf-8,\uFEFF"; 
            let fileName = "";

            if (exportType === 'all') {
                fileName = `${project.title}_最新盤點總表.csv`;
                csvContent += "物品代碼,物品名稱,目前位置,最新數量,單價估值,總計價值,建檔時間,建檔人\n";
                project.masterItems.forEach(item => {
                    const totalValue = (item.stockQty || 0) * (item.price || 0);
                    const row = [item.code || '', item.name || '', item.location || '', item.stockQty || 0, item.price || 0, totalValue, item.createdAt || '', item.creator || ''];
                    csvContent += row.map(str => `"${String(str).replace(/"/g, '""')}"`).join(',') + "\n";
                });
            } else {
                const startStr = document.getElementById('export-start').value;
                const endStr = document.getElementById('export-end').value;
                if (!startStr || !endStr) return window.showToast('請選擇完整的日期', 'error');
                const startTime = new Date(startStr + 'T00:00:00'); const endTime = new Date(endStr + 'T23:59:59');
                fileName = `${project.title}_異動明細_${startStr}至${endStr}.csv`;
                csvContent += "紀錄時間,操作人員,物品代碼,物品名稱,原數量,實盤數量,增減異動,原位置,新位置,物品狀態,備註說明\n";
                let hasChanges = false;

                project.masterItems.forEach(master => {
                    if (master.createdAt && !master.createdFromInventory) {
                        const parts = master.createdAt.split(' '); const dateParts = parts[0].split('/'); const timeParts = parts[1].split(':');
                        const createdDate = new Date(dateParts[0], dateParts[1]-1, dateParts[2], timeParts[0], timeParts[1]);
                        if (createdDate >= startTime && createdDate <= endTime) {
                            hasChanges = true;
                            const row = [ master.createdAt, master.creator || '系統', master.code || '', master.name || '', 0, master.stockQty || 0, '新增建檔', '-', master.location || '-', '正常', '基準物品新建' ];
                            csvContent += row.map(str => `"${String(str).replace(/"/g, '""')}"`).join(',') + "\n";
                        }
                    }
                });

                project.records.forEach(record => {
                    const parts = record.timestamp.split(' '); const dateParts = parts[0].split('/'); const timeParts = parts[1].split(':');
                    const recordDate = new Date(dateParts[0], dateParts[1]-1, dateParts[2], timeParts[0], timeParts[1]);
                    if (recordDate >= startTime && recordDate <= endTime) {
                        record.items.forEach(item => {
                            const isQtyChanged = item.expectedQty !== item.actualQty; const isLocChanged = item.expectedLocation !== item.actualLocation;
                            if (isQtyChanged || isLocChanged) {
                                hasChanges = true; const master = project.masterItems.find(m => m.id === item.masterId);
                                const qtyDiff = item.actualQty - item.expectedQty; const diffStr = qtyDiff > 0 ? `+${qtyDiff}` : qtyDiff;
                                const row = [ record.timestamp, record.auditor, master ? master.code : '', master ? master.name : '未知物品', item.expectedQty, item.actualQty, isQtyChanged ? diffStr : '無', item.expectedLocation || '', isLocChanged ? item.actualLocation : '-', item.status || '', item.remark || '' ];
                                csvContent += row.map(str => `"${String(str).replace(/"/g, '""')}"`).join(',') + "\n";
                            }
                        });
                    }
                });
                if (!hasChanges) { window.showToast('所選期間內無任何異動紀錄 (含新增與盤點)', 'info'); return; }
            }

            window.showToast('報表產生中...', 'info');
            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a"); link.setAttribute("href", encodedUri); link.setAttribute("download", fileName);
            document.body.appendChild(link); link.click(); document.body.removeChild(link);
            window.closeModal(); window.showToast('✅ 報表已成功匯出！');
        };

        window.render = () => {
            const root = document.getElementById('root');
            root.innerHTML = '';
            const viewContainer = document.createElement('div');
            viewContainer.className = 'w-full h-full flex flex-col fade-in relative';
            
            if (window.state.isLoading) {
                viewContainer.innerHTML = window.getLoadingHTML();
            } else {
                switch(window.state.currentView) {
                    case 'login': viewContainer.innerHTML = window.getLoginHTML(); break;
                    case 'dashboard': viewContainer.innerHTML = window.getDashboardHTML(); break;
                    case 'project': viewContainer.innerHTML = window.getProjectHTML(); break;
                    case 'location_settings': viewContainer.innerHTML = window.getLocationSettingsHTML(); break;
                    case 'item_settings': viewContainer.innerHTML = window.getItemSettingsHTML(); break;
                    case 'item_history': viewContainer.innerHTML = window.getItemHistoryHTML(); break;
                    case 'master_form': viewContainer.innerHTML = window.getMasterFormHTML(); break;
                    case 'active_inventory': viewContainer.innerHTML = window.getActiveInventoryHTML(); break;
                    case 'inventory_form': viewContainer.innerHTML = window.getInventoryFormHTML(); break;
                    case 'record_detail': viewContainer.innerHTML = window.getRecordDetailHTML(); break;
                }
            }
            root.appendChild(viewContainer);
        };

        window.getLoadingHTML = () => `
            <div class="flex-1 flex flex-col items-center justify-center bg-gray-50">
                <i class="fas fa-cloud-download-alt text-4xl text-indigo-400 mb-4 animate-bounce"></i>
                <div class="text-indigo-900 font-extrabold text-lg tracking-wide">連線同步中...</div>
                <div class="text-gray-400 text-xs mt-2">正在與雲端資料庫交換資料</div>
            </div>
        `;

        window.getLoginHTML = () => {
            return `
            <div class="flex-1 flex flex-col justify-center px-8 bg-gradient-to-br from-indigo-50 to-white relative z-10 overflow-y-auto py-8">
                <div class="w-20 h-20 bg-indigo-600 rounded-3xl flex items-center justify-center text-white text-4xl shadow-lg mb-6 mx-auto shrink-0">
                    <i class="fas fa-boxes"></i>
                </div>
                <h1 class="text-3xl font-extrabold text-center text-gray-800 mb-2 tracking-tight">盤點快手</h1>
                <p class="text-center text-gray-500 mb-8 text-sm font-medium"><i class="fas fa-cloud text-indigo-400 mr-1"></i> 雲端即時同步版</p>
                <div class="bg-white p-6 rounded-3xl shadow-[0_8px_30px_rgb(0,0,0,0.04)] border border-gray-100 flex flex-col items-center shrink-0">
                    
                    ${window.systemConfig.enableWhitelist ? `<div class="w-full bg-red-50 text-red-600 text-xs p-3 rounded-lg font-bold mb-6 flex items-center gap-2 border border-red-100"><i class="fas fa-lock"></i> 系統已啟用存取限制，僅限受邀帳號登入。</div>` : ''}

            provider.setCustomParameters({ prompt: 'select_account' });

            try {
                window.showToast('導向 Google 登入...', 'info');
                const result = await signInWithPopup(auth, provider);
                const user = result.user;
                
                if (window.systemConfig.enableWhitelist) {
                    if (!window.systemConfig.allowedEmails.includes(user.email)) {
                        await auth.signOut();
                        return window.showToast('⚠️ 登入失敗：您的帳號不在授權名單內', 'error');
                    }
                }

                window.state.uid = user.uid;
                
                const userProfile = { uid: user.uid, name: user.displayName || 'Google 用戶', email: user.email, registeredAt: new Date().toISOString() };
                
                try {
                    await setDoc(doc(db, 'artifacts', currentAppId, 'public', 'data', 'users', window.state.uid), userProfile);
                } catch (writeErr) {

                }
                window.showToast('✅ 登入成功！');

                console.error("Google Login Error:", e);
                if (e.code === 'auth/popup-closed-by-user') {
                    window.showToast('已取消 Google 登入', 'info');
                } else if (e.code === 'auth/unauthorized-domain') {
                    window.showToast('❌ 錯誤：目前的網域尚未加入 Firebase 授權名單', 'error');

                    }))
                };
            }
            window.state.currentView = 'active_inventory'; window.render();
        };

        window.getActiveInventoryHTML = () => {
            const project = window.state.projects.find(p => p.id === window.state.selectedProjectId);
            const session = window.state.activeSession;
            const completedCount = session.items.filter(i => i.isChecked).length;
            const totalCount = session.items.length;
            const progress = totalCount === 0 ? 0 : Math.round((completedCount / totalCount) * 100);

            const itemsHTML = session.items.map(item => {
                const master = project.masterItems.find(m => m.id === item.masterId);
                if(!master) return ''; 
                const isQtyChanged = item.isChecked && (item.expectedQty !== item.actualQty);
                const isLocChanged = item.isChecked && (item.expectedLocation !== item.actualLocation);
                const isChanged = isQtyChanged || isLocChanged;
                
                const statusBadge = item.isChecked ? `<span class="px-2 py-0.5 text-[11px] font-bold rounded ${window.getStatusColorClass(item.status)}">${item.status}</span>` : `<span class="px-2 py-0.5 text-[11px] font-bold rounded bg-gray-200 text-gray-500">待盤</span>`;
                const checkIcon = item.isChecked ? `<div class="w-10 h-10 rounded-full bg-indigo-100 text-indigo-600 flex items-center justify-center flex-shrink-0 border-2 border-indigo-200"><i class="fas fa-check"></i></div>` : `<div class="w-10 h-10 rounded-full bg-white border-2 border-dashed border-gray-300 text-gray-300 flex items-center justify-center flex-shrink-0"><i class="fas fa-minus"></i></div>`;

                return `

                            <div class="text-[11px] text-gray-500 mb-2">${isLocChanged ? `<span class="text-red-500 font-bold"><i class="fas fa-route"></i> ${item.actualLocation || '未定'}</span> (原: ${item.expectedLocation || '無'})` : `<i class="fas fa-map-marker-alt"></i> ${item.actualLocation || '未設定地點'}`}</div>

            return `

                        <i class="fas fa-save"></i> 結束盤點並儲存紀錄

            window.state.currentView = 'inventory_form';

            files.forEach(file => {
                window.compressImage(file, (base64) => {
                    window.state.tempInventoryPhotos.push(base64);

                    if(processed === files.length) {

                        window.showToast('現場照片已載入');

                });

                            </div>
                            <i class="fas fa-long-arrow-alt-right text-indigo-300 text-xl"></i>
                            <div class="flex-1 relative">

                                <input type="number" id="i-actual" value="${sessionItem.isChecked ? sessionItem.actualQty : sessionItem.expectedQty}" class="w-full border-[3px] border-indigo-400 rounded-xl px-2 py-3 text-indigo-700 font-black text-3xl text-center outline-none focus:ring-4 focus:ring-indigo-300 transition-all bg-white shadow-inner">
                            </div>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-gray-500 mb-2 uppercase tracking-wide">當下實際位置 (有異動請更改)</label>
                            <select id="i-location" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 text-gray-800 font-bold outline-none focus:bg-white focus:ring-2 focus:ring-indigo-500">
                                <option value="">未設定地點</option>
                                ${project.locationTags.map(loc => `<option value="${loc}" ${sessionItem.actualLocation === loc ? 'selected' : ''}>${loc}</option>`).join('')}
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-gray-500 mb-2 uppercase tracking-wide">物品狀態</label>
                            <select id="i-status" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 text-gray-800 outline-none focus:bg-white focus:ring-2 focus:ring-indigo-500">
                                <option value="">請選擇狀態...</option>
                                ${window.state.options.statuses.map(s => `<option value="${s}" ${sessionItem.status === s ? 'selected' : ''}>${s}</option>`).join('')}
                            </select>

                        <div>

                            <textarea id="i-remark" rows="3" placeholder="異常說明 (如: 破損狀況描述)..." class="w-full h-[100px] bg-gray-50 border border-gray-200 rounded-xl px-3 py-2 text-gray-800 text-sm outline-none focus:bg-white focus:ring-2 focus:ring-indigo-500 resize-none">${sessionItem.remark}</textarea>
                        </div>
                    </div>
                </div>
                <div class="absolute bottom-0 left-0 w-full p-5 flex justify-center bg-gradient-to-t from-gray-50 via-gray-50 to-transparent pb-8 z-10 pointer-events-none">
                    <button onclick="window.saveInventoryCount()" class="pointer-events-auto w-full max-w-[400px] bg-indigo-600 text-white font-bold py-4 rounded-xl shadow-lg hover:bg-indigo-700 active:scale-95 transition-all text-lg flex justify-center items-center">儲存盤點結果</button>
                </div>
            `;

        window.saveInventoryCount = () => {
            const actual = parseInt(document.getElementById('i-actual').value);
            if (isNaN(actual) || actual < 0) return window.showToast('請輸入有效的盤點數量', 'error');

            const sessionItem = window.state.activeSession.items.find(i => i.masterId === window.state.editingCountId);
            sessionItem.actualQty = actual;
            sessionItem.actualLocation = document.getElementById('i-location').value;
            sessionItem.status = document.getElementById('i-status').value;
            sessionItem.remark = document.getElementById('i-remark').value;
            
            const finalPhotos = [...window.state.tempInventoryPhotos];
            sessionItem.photos = finalPhotos;
            sessionItem.photo = finalPhotos.length > 0 ? finalPhotos[0] : null; 
            
            sessionItem.isChecked = true;

            const isChanged = (sessionItem.expectedQty !== sessionItem.actualQty) || (sessionItem.expectedLocation !== sessionItem.actualLocation);
            window.showToast(isChanged ? '已記錄 (發現異動，請多加留意！)' : '已記錄盤點');

                const searchInput = document.getElementById('inventory-search-input');
                if (searchInput && searchInput.value) window.filterActiveInventory(searchInput.value);
            }, 10);

        window.filterActiveInventory = (keyword) => {
            const term = keyword.toLowerCase();
            document.querySelectorAll('.inventory-card').forEach(card => {
                const searchStr = card.getAttribute('data-search') || '';
                card.style.display = searchStr.includes(term) ? 'flex' : 'none';
            });
        };

            const completedCount = session.items.filter(i => i.isChecked).length;

            if (completedCount < session.items.length) {

                    <p class="text-sm text-red-500 mb-6 font-bold">尚有 ${session.items.length - completedCount} 項物品未盤點！</p>
                    <div class="flex gap-3">
                        <button onclick="window.closeModal()" class="flex-1 py-3 bg-gray-100 text-gray-600 font-bold rounded-xl active:bg-gray-200">繼續盤點</button>
                        <button onclick="window.confirmFinishSession()" class="flex-1 py-3 bg-indigo-600 text-white font-bold rounded-xl active:bg-indigo-700 shadow-md">強制結束</button>
                    </div>
                `);
            } else window.confirmFinishSession();
        };

        window.confirmFinishSession = () => {
            window.closeModal();
            const project = window.state.projects.find(p => p.id === window.state.selectedProjectId);
            const session = window.state.activeSession;
            
            const now = new Date();
            const timeString = `${now.getFullYear()}/${String(now.getMonth()+1).padStart(2,'0')}/${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
            
            const newRecord = {
                recordId: 'R-' + Date.now(), timestamp: timeString, auditor: window.state.currentUser ? window.state.currentUser.name : '未知',
                items: session.items.filter(i => i.isChecked)
            };
            
            newRecord.items.forEach(recordItem => {
                const masterItem = project.masterItems.find(m => m.id === recordItem.masterId);
                if (masterItem) {
                    if (recordItem.actualLocation !== masterItem.location) masterItem.location = recordItem.actualLocation;
                    if (recordItem.actualQty !== masterItem.stockQty) masterItem.stockQty = recordItem.actualQty;
                }
            });

            project.records.unshift(newRecord); 
            window.syncProjectToCloud(project); 
            
            window.state.activeSession = null; 
            window.state.currentView = 'project'; 
            window.showToast('✅ 盤點結果已成功同步至雲端');
            window.render();

                const isQtyChanged = item.expectedQty !== item.actualQty;
                const isLocChanged = item.expectedLocation !== item.actualLocation;
                const isChanged = isQtyChanged || isLocChanged;
                
                const itemPhotos = item.photos && item.photos.length > 0 ? item.photos : (item.photo ? [item.photo] : []);

                    <div class="flex gap-2 overflow-x-auto no-scrollbar mb-3 pb-2">
                        ${itemPhotos.map(p => `<img src="${p}" class="h-24 rounded-lg object-cover border border-gray-200 shrink-0">`).join('')}
                    </div>` : '';

                return `
                    <div class="bg-white rounded-xl p-4 mb-3 shadow-sm border ${isChanged ? 'border-red-300 ring-1 ring-red-100' : 'border-gray-100'} relative">

                            <h4 class="font-bold text-gray-800 text-sm">${master ? master.name : '未知物品'}</h4>
                            <span class="px-2 py-0.5 text-[11px] font-bold rounded ${window.getStatusColorClass(item.status)}">${item.status || '未註記'}</span>

                    </div>
                    <div class="bg-gray-50 p-4 border-b border-gray-100">
                        <div class="text-sm font-bold text-gray-700 mb-1"><i class="fas fa-clock mr-1"></i> ${record.timestamp}</div>
                        <div class="text-xs text-gray-500"><i class="fas fa-user-check mr-1"></i> 盤點人: ${record.auditor}</div>
                    </div>
                </div>
                <div class="flex-1 overflow-y-auto no-scrollbar p-4 pb-10">${listHTML}</div>
            `;
        };

        window.render();
    </script>
</body>
</html>
